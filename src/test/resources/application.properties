spring.application.name=backend-test

# 테스트는 실제 Supabase를 건드리지 않고 PostgreSQL 호환 모드의 메모리 DB를 사용합니다.
spring.datasource.url=jdbc:h2:mem:mealfit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS mealfit
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=mealfit
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-must-be-at-least-32-bytes-long
app.jwt.expiration-seconds=3600

# 테스트 컨텍스트 생성용 값이며 외부 KAMIS 호출은 수행하지 않습니다.
kamis.api.url=http://localhost:9/kamis-test
kamis.api.key=test-key
kamis.api.id=test-id
