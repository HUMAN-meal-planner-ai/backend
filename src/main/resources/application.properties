spring.application.name=backend
server.port=8080

spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=mealfit
spring.jpa.open-in-view=false

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.human.backend
mybatis.configuration.map-underscore-to-camel-case=true

# AI Server
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# JWT
# 운영 환경에서는 반드시 충분히 긴 무작위 값으로 변경합니다.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
