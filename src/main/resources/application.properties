spring.application.name=backend
server.port=8080

spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase의 제한된 연결 수를 팀원별 로컬 서버가 과도하게 점유하지 않도록
# 백엔드 인스턴스 하나가 사용할 수 있는 DB 연결을 최대 3개로 제한합니다.
spring.datasource.hikari.maximum-pool-size=3

# 요청이 적을 때도 유지할 최소 연결 수입니다. 사용하지 않는 연결을 불필요하게 잡아두지 않습니다.
spring.datasource.hikari.minimum-idle=1

# 최소 유휴 연결을 초과한 연결이 30초 동안 사용되지 않으면 풀에서 정리합니다.
spring.datasource.hikari.idle-timeout=30000

# 풀의 연결이 모두 사용 중일 때 최대 30초까지만 기다린 뒤 연결 시간 초과 오류를 반환합니다.
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=mealfit
spring.jpa.open-in-view=false

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.human.backend
mybatis.configuration.map-underscore-to-camel-case=true

# AI Server
ai.server.url=${AI_SERVER_URL:http://localhost:8000}

# JWT
# 운영 환경에서는 반드시 충분히 긴 무작위 값으로 변경합니다.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# KAMIS API
kamis.api.url=https://www.kamis.or.kr/service/price/xml.do
kamis.api.key=${KAMIS_API_KEY}
kamis.api.id=${KAMIS_CERT_ID}
kamis.api.country-code=${KAMIS_COUNTRY_CODE:1101}
kamis.api.convert-kg-yn=${KAMIS_CONVERT_KG_YN:Y}

# KAMIS 자동 가격 수집
kamis.collection.schedule.cron=${KAMIS_COLLECTION_SCHEDULE_CRON:0 0 6 * * *}
kamis.collection.schedule.lookback-days=${KAMIS_COLLECTION_LOOKBACK_DAYS:7}
kamis.collection.schedule.zone=${KAMIS_COLLECTION_SCHEDULE_ZONE:Asia/Seoul}
